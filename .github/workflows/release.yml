name: Release

# release-please keeps a "chore(main): release x.y.z" pull request open that bumps the version and writes the
# changelog from the Conventional Commits merged since the last release. Merging that PR tags the release;
# the job below then builds the installer and attaches it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # A PAT or GitHub App token lets release PRs trigger CI; PRs opened with
          # GITHUB_TOKEN do not, so the required "build" check would never run on them.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build app and installer
        shell: pwsh
        run: ./build.ps1 -Installer -Version "${{ needs.release-please.outputs.version }}"
      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "dist/Frostbyte-Setup-${{ needs.release-please.outputs.version }}.exe" --clobber
