name: CI

# Every pull request (and every push to main) must build, including the installer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build app and installer
        shell: pwsh
        run: ./build.ps1 -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: Frostbyte-installer
          path: dist/*.exe
          retention-days: 14

  # PR titles become the squash-commit message, which drives versioning, so they must follow Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
